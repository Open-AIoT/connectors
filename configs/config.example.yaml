# 飞书参考连接器配置示例。复制为 configs/config.local.yaml 后修改
# （*.local.yaml 已在 .gitignore 中，凭据不会进版本库）。

# HTTP 监听地址（真实飞书模式；mock 模式不监听）
listen: "127.0.0.1:8090"

mcp:
  # 上游 MCP 接入层端点（Open-AIoT/mcp 仓的适配器；demo 联调见 README）
  endpoint: "http://127.0.0.1:8081/mcp"
  # 接入层 Bearer token。一期身份映射为策略 a（shared）：全体飞书用户共用此凭据，
  # 用户身份仅进审计。设备范围由该凭据在接入层的 scope 决定。
  token: "demo-client-token"

confirm:
  # 确认超时（超时默认拒绝）。默认 2m。
  timeout: 2m
  # 追加的需确认工具名（与上游安全分级标注推导取并集，只能收紧）：
  # tools: ["some_tool"]

feishu:
  # mock 模式：本地 REPL，不连飞书开放平台。真实接入置 false 并填下列凭据。
  mock: true
  # ---- 真实飞书接入必填（企业自建应用，凭据留白——部署方自填，勿提交）----
  # app_id: ""
  # app_secret: ""
  # 事件订阅安全设置（建议都配置；encrypt_key 为空则按明文回调处理）：
  # encrypt_key: ""
  # verification_token: ""
  # API 基地址（默认官方；测试可指向 mock）：
  # api_base: "https://open.feishu.cn"
